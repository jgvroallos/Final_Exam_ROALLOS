---
- hosts: all
  become: true
  pre_tasks:

  - name: Install Updates (CentOS, Ubuntu)
    package:
      update_cache: yes
    changed_when: false

- hosts: all
  become: true
  vars_files: config.yml
  roles:
    - apache
    - grafana

- hosts: all
  become: true
  vars_files: config.yml
  tasks:

  - name: Set/Update MOTD (/etc/motd, CentOS/Ubuntu)
    copy:
      dest: /etc/motd
      content: "{{ motd_msg }}"
      mode: '0644'
